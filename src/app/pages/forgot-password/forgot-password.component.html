<p-toast></p-toast>
<div class="forgot-wrapper">
  <div class="forgot-card">
    <h2>Quên mật khẩu</h2>

    <div *ngIf="step === 1">
      <label>Email</label>
      <input pInputText type="email" [formControl]="form.controls.email" placeholder="Nhập email của bạn" />
      <p-button label="Gửi OTP" (onClick)="sendOtp()" [disabled]="isLoading" [loading]="isLoading"></p-button>
    </div>

    <div *ngIf="step === 2">
      <label>OTP</label>
      <input pInputText type="text" [formControl]="form.controls.otp" placeholder="Nhập mã OTP" />

      <label>Mật khẩu mới</label>
      <input pInputText type="password" [formControl]="form.controls.newPassword" placeholder="Mật khẩu mới" />

      <p-button label="Xác nhận và đặt lại" (onClick)="verifyAndReset()" [disabled]="isLoading" [loading]="isLoading"></p-button>

      <div style="margin-top:12px; display:flex; align-items:center; gap:8px">
        <span>Chưa nhận được mã?</span>
        <p-button
          [label]="resendDisabled ? ('Gửi lại sau ' + countdown + 's') : 'Gửi lại'"
          (onClick)="resendOtp()"
          [disabled]="resendDisabled || isLoading"
          [loading]="isLoading"
          styleClass="p-button-text"
        ></p-button>
      </div>
    </div>

    <div class="links">
      <a routerLink="/login">Quay lại đăng nhập</a>
    </div>
  </div>
</div>
