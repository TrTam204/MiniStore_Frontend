<div class="giaodien">
    <div class="form-container">
        <div class="form-title">
            Edit Product
        </div>
<form [formGroup]="form" (ngSubmit)="onSaveProduct()" style="width: 70%; margin: auto;">
  <div class="form-control">
    <label for="name">Name</label>
    <div>
      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Name"
      />
      <small *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-red-500" style="color: red;">Vui lòng nhập tên sản phẩm!</small>
    </div>
  </div>
    <div class="form-control">
    <label for="importPrice">Import Price</label>
    <div>
      <input
        id="importPrice"
        type="number"
        formControlName="importPrice"
        placeholder="Import Price"
      />
      <small *ngIf="form.get('importPrice')?.invalid && form.get('importPrice')?.touched" class="text-red-500" style="color: red;">Vui lòng nhập giá nhập!</small>
    </div>
  </div>
    <div class="form-control">
    <label for="sellPrice">Sell Price</label>
    <div>
      <input
        id="sellPrice"
        type="number"
        formControlName="sellPrice"
        placeholder="Sell Price"
      />
      <small *ngIf="form.get('sellPrice')?.invalid && form.get('sellPrice')?.touched" class="text-red-500" style="color: red;">Vui lòng nhập giá bán!</small>
    </div>
  </div>
  <div class="form-control">
    <label for="imageUrl">Image</label>
        <div class="p-inputgroup">
        <input
            pInputText
            formControlName="imageUrl"
            placeholder="Paste image URL or upload file"
        />

        <button
            pButton
            type="button"
            icon="pi pi-upload"
            label="Upload"
            (click)="imageFileInput.click()">
        </button>
    </div>
    <input
      #imageFileInput
      type="file"
      accept="image/*"
      hidden
      (change)="onFileSelect($event)"
    />
    <div *ngIf="form.get('imageUrl')?.value" class="image-preview" style="margin-top: 1rem;">
      <p>Ảnh hiện tại:</p>
      <img [src]="getFullImageUrl(form.get('imageUrl')?.value)" alt="Ảnh sản phẩm" style="max-width: 100%; max-height: 280px; object-fit: contain;" />
    </div>
</div>
    <div class="form-control">
        <label for="quantity">Quantity</label>
        <div>
          <input
            id="quantity"
            type="number"
            formControlName="quantity"
            placeholder="Quantity"
          />
          <small *ngIf="form.get('quantity')?.invalid && form.get('quantity')?.touched" class="text-red-500" style="color: red;">Vui lòng nhập số lượng!</small>
        </div>
    </div>
  <div class="form-control">
    <label for="description">Description</label>
    <div>
      <textarea
        id="description"
        formControlName="description"
        placeholder="Description"
      ></textarea>
    </div>
    </div>
    <div class="form-control">
    <label for="categoryId">Category</label>
    <div>
        <select id="categoryId" formControlName="categoryId">
            <option [ngValue]="null">-- Chọn danh mục --</option>

            <option
                *ngFor="let category of categories"
                [ngValue]="category.id">
                {{ category.name }}
            </option>
        </select>

        <small *ngIf="form.get('categoryId')?.invalid && form.get('categoryId')?.touched" class="text-red-500" style="color: red;">
            Vui lòng chọn danh mục!
          </small>
        
    </div>
    </div>
      <div class="form-control">
      <label for="brandId">Thương hiệu</label>
      <div>
        <p-dropdown id="brandId" [options]="brands" optionLabel="name" optionValue="id" formControlName="brandId" placeholder="-- Chọn thương hiệu --" [showClear]="true"></p-dropdown>
        <small *ngIf="form.get('brandId')?.invalid && form.get('brandId')?.touched" class="text-red-500" style="color: red;">Vui lòng chọn thương hiệu!</small>
      </div>
      </div>
<div class="btn-group">
  <button type="submit" class="save-btn">Save</button>
  <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>
</div>
</form>
    </div>
</div>
