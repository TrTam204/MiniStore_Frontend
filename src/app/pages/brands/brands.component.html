<p-card styleClass="admin-card">
  <p-toolbar styleClass="admin-toolbar">
    <ng-template pTemplate="start">
      <div>
        <h2 class="page-title">Quản lý Thương hiệu</h2>
        <p class="page-subtitle">Danh sách thương hiệu trong hệ thống</p>
      </div>
    </ng-template>

    <ng-template pTemplate="end">
      <button
        pButton
        type="button"
        label="Thêm thương hiệu"
        icon="pi pi-plus"
        severity="success"
        routerLink="/admin/brand/add">
      </button>
    </ng-template>
  </p-toolbar>

  <div class="table-scroll">
  <p-table
    [value]="brands"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    [tableStyle]="{ 'width': '100%', 'table-layout': 'fixed' }"
    styleClass="category-table compact-table"
    stripedRows
    showGridlines>

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 90px">ID</th>
        <th>Tên thương hiệu</th>
        <th style="width: 140px">Quốc gia</th>
        <th>Mô tả</th>
        <th style="width: 160px">Thao tác</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-brand>
      <tr>
        <td>{{ brand.id }}</td>
        <td>{{ brand.name }}</td>
        <td>{{ brand.country }}</td>
        <td>
          <div class="description-text" [title]="brand.description">
            {{ brand.description }}
          </div>
        </td>
        <td>
          <div class="table-actions">
            <button
              pButton
              type="button"
              label="Sửa"
              icon="pi pi-pencil"
              severity="info"
              size="small"
              class="action-btn"
              [routerLink]="['/admin/brand/edit', brand.id]">
            </button>
            <button
              pButton
              type="button"
              label="Xóa"
              icon="pi pi-trash"
              severity="danger"
              size="small"
              class="action-btn"
              (click)="deleteBrand(brand.id, brand.name)">
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty-message">
          Chưa có thương hiệu nào.
        </td>
      </tr>
    </ng-template>
  </p-table>
  </div>
</p-card>
